<!DOCTYPE html>
<html>
<head>
<title>Contact</title>

<style>
body {
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

input, textarea {
  width:80%;
  padding:12px;
  margin:10px;
  border:none;
  border-radius:5px;
}

button {
  padding:12px 25px;
  background:#22c55e;
  border:none;
  cursor:pointer;
}

.success {
  display:none;
  color:#22c55e;
  margin-top:20px;
}
</style>

<script>
function submitForm(){
  document.getElementById("success").style.display="block";
}
</script>

</head>

<body>

<h1>Book a Service</h1>

<input type="text" placeholder="Your Name"><br>
<input type="text" placeholder="Address"><br>
<textarea placeholder="What do you need?"></textarea><br>

<button onclick="submitForm()">Send Request</button>

<p id="success" class="success">Request Sent! We’ll contact you soon.</p>

<br><br>
<a href="index.html">⬅ Back Home</a>

</body>
</html>
