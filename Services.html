<!DOCTYPE html>
<html>
<head>
<title>Services</title>

<style>
body {
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.card {
  background:#1e293b;
  margin:20px auto;
  padding:25px;
  width:250px;
  border-radius:10px;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.05);
}

.price {
  color:#22c55e;
  font-size:22px;
}

button {
  padding:10px 20px;
  background:#22c55e;
  border:none;
  cursor:pointer;
}
</style>

<script>
function go(page){
  document.body.style.opacity="0";
  setTimeout(()=>{ window.location = page; }, 400);
}
</script>

</head>

<body>

<h1>Our Services</h1>

<div class="card">
  <h2>Lawn Mowing</h2>
  <p class="price">$20+</p>
  <button onclick="go('contact.html')">Book</button>
</div>

<div class="card">
  <h2>Leaf Cleanup</h2>
  <p class="price">$15+</p>
  <button onclick="go('contact.html')">Book</button>
</div>

<div class="card">
  <h2>Full Yard Clean</h2>
  <p class="price">$40+</p>
  <button onclick="go('contact.html')">Book</button>
</div>

<br>
<a href="#" onclick="go('index.html')">⬅ Back</a>

</body>
</html>
